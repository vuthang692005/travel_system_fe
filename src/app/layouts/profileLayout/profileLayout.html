<div class="min-h-screen bg-slate-50 py-10">
  <div class="max-w-7xl mx-auto px-10 flex gap-8">
    <aside class="w-2/8 space-y-6">
      <div
        class="bg-white rounded-[0.5rem] p-8 shadow-sm flex flex-col items-center text-center border border-white"
      >
        <div class="relative w-24 h-24 mb-4">
          <img
            [src]="profilePhotoUrl()"
            class="w-full h-full rounded-full object-cover border-4 border-white shadow-md"
            onerror="this.src = 'avatarDDefault.png'"
          />

          <button
            type="button"
            (click)="fileInput.click()"
            class="absolute bottom-0 right-0 w-8 h-8 bg-white rounded-full shadow-md border border-gray-100 flex items-center justify-center transition-transform active:scale-90 hover:bg-gray-50"
          >
            <i class="fas fa-camera text-gray-400 text-[14px]"></i>
          </button>

          <input #fileInput type="file" class="hidden" accept="image/*" />
        </div>
        <h3 class="text-xl font-bold text-slate-800">{{ userName() }}</h3>
        <p class="text-gray-400 text-sm mb-4">{{ userEmail() }}</p>
        <span
          class="px-4 py-1 bg-blue-50 text-blue-600 text-[10px] font-bold rounded-full uppercase tracking-widest"
        >
          {{ membershipRank() }}
        </span>
      </div>

      <nav class="bg-white rounded-[0.5rem] p-4 shadow-sm border border-white overflow-hidden">
        @for (item of sidebarMenu; track item.label) {
          <a
            [routerLink]="item.path"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            routerLinkActive="bg-blue-50 !text-blue-600"
            #rla="routerLinkActive"
            class="flex items-center gap-4 px-6 py-4 rounded-2xl text-gray-500 font-medium transition-all hover:bg-gray-50 group mb-1"
          >
            <i [class]="item.icon" class="w-5 text-center text-lg"></i>
            <span class="text-sm">{{ item.label }}</span>

            <div
              [class.opacity-100]="rla.isActive"
              class="ml-auto w-1.5 h-1.5 bg-blue-600 rounded-full opacity-0 transition-opacity"
            ></div>
          </a>
        }

        <div class="h-px bg-gray-100 my-4 mx-6"></div>

        <button
          (click)="onLogout()"
          class="flex items-center gap-4 px-6 py-4 w-full rounded-2xl text-red-500 font-bold hover:bg-red-50 transition-all"
        >
          <i class="fas fa-sign-out-alt w-5 text-center text-lg rotate-180"></i>
          <span class="text-sm">Đăng xuất</span>
        </button>
      </nav>
    </aside>

    <main class="flex-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
